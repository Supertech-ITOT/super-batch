# =========================================================
# SERVER
# =========================================================

spring.application.name=superbatch
server.port=8080
server.address=0.0.0.0

# =========================================================
# CORS
# =========================================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.1.125:3000}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/superbatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:7e2f9d8c4b1a6f3fff9c1a7b5f2d8e6c}
jwt.expiration=86400000

# =========================================================
# LOGGING
# =========================================================

debug=false
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF
logging.level.org.hibernate=WARN
logging.level.org.hibernate.orm.query=ERROR
logging.level.org.apache=WARN
logging.level.com.zaxxer.hikari=OFF
logging.level.org.springdoc=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.org.flywaydb=WARN

logging.pattern.console=%d{HH:mm:ss} %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.file.name=C:/ProgramData/SuperBatch/logs/superbatch.log

logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.file-name-pattern=C:/ProgramData/SuperBatch/logs/superbatch-%d{yyyy-MM-dd}.%i.log

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=SuperBatch
info.app.description=SuperBatch Batch Management System
info.app.version=1.0.0

# =========================================================
# LICENSE
# =========================================================

license.server.base-url=${LICENSE_SERVER_URL:http://192.168.1.126:8081}
license.validation.interval=3600000
license.public-

# =========================================================
# UI
# =========================================================

spring.main.banner-mode=off